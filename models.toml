# API keys never live in this file.
[profiles.beam-hf]
base_url = "https://router.huggingface.co/v1"
model = "reflection/Beam-1.0-501B-A23B:baseten"
key_env = "BEAM_HF_TOKEN"
reasoning_echo = "reasoning_content"
price_in_per_m = 0.40
price_out_per_m = 1.20

[profiles.beam-openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "reflection/beam-1.0-501b-a23b"
key_env = "BEAM_OPENROUTER_KEY"
price_in_per_m = 0.25
price_out_per_m = 1.00

# A near-free route, tried for dry runs (router listing 2026-10-22). Not usable
# for agent work: from its second turn on, its tool calls arrive inside the
# reasoning text with no tool call, with or without the reasoning echoed back
# (both field names tried, 2026-10-22). Try another provider before using it.
[profiles.oss-hf]
base_url = "https://router.huggingface.co/v1"
model = "openai/gpt-oss-120b:deepinfra"
key_env = "BEAM_HF_TOKEN"
price_in_per_m = 0.04
price_out_per_m = 0.17

[profiles.scripted-sample]
kind = "scripted"
script = "tests/data/sample_script.json"
